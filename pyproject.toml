[project]
name = "local-llm-project"
version = "0.1.0"
description = "Local LLM + Embedding + LangGraph multi-agent with memory, HITL, and code review"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "openai>=1.0.0",
    "python-dotenv>=1.0.0",
    "langgraph>=0.2.0",
    "langchain-openai>=0.2.0",
    "langchain-core>=0.3.0",
    "qdrant-client>=1.10.0",
    "chromadb>=0.5.0",
    "requests>=2.32.0",
    "langgraph-checkpoint-redis>=0.0.1",
    "langgraph-checkpoint-sqlite>=2.0.0",
    "langfuse>=4.12.0",
    "langchain>=1.3.11",
    "javalang>=0.13.0",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "ruff>=0.4.0",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
]
api = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.27.0",   # مورد نیاز fastapi.testclient.TestClient
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.hatch.build.targets.wheel]
packages = ["src/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short --cov=src --cov-report=term-missing --cov-report=html:htmlcov --cov-fail-under=80"
markers = [
    "integration: Integration tests requiring external services",
]
filterwarnings = [
    "ignore::starlette.exceptions.StarletteDeprecationWarning"
]
 
[tool.coverage.run]
source = ["src"]
omit = [
    "src/__init__.py",
    "src/agents/__init__.py",
    "src/agents/code_review/__init__.py",
    "src/agents/code_review/gitlab/__init__.py",
    "src/agents/code_review/reviewer/__init__.py",
    "src/agents/code_review/decision/__init__.py",
    "src/agents/code_review/scoring/__init__.py",
    "src/debug/__init__.py",
    "src/debug/handlers/__init__.py",
    "src/memory/__init__.py",
    "src/vector_store/__init__.py",
    "src/checkpointer/__init__.py",
    # نیاز به سرور خارجی دارند — در integration tests تست می‌شوند
    "src/checkpointer/redis_checkpointer.py",
    "src/checkpointer/backends/redis_backend.py",
    "src/vector_store/chroma_store.py",
    "src/ingest/__init__.py",
    "src/ingest/business/__init__.py",
]
 
[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "@abstractmethod",
    "raise NotImplementedError",
    "\\.\\.\\.",
]
